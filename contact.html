<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Contact</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>

<body>
    <header>
        <h1>Page for my Projects</h1>
        <nav>
            <a href="index.html">Index</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
       <form method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="reason">Reason</label>
        <select id="reason" name="reason" required>
        <option value="">Select one</option>
        <option value="Questions">Questions</option>
        <option value="Feedback">Feedback</option>
        <option value="help">Help</option>
        </select>

        <fieldset>
        <legend>Preferred contact method</legend>
        <input type="radio" id="theemail" name="contact" value="email">
        <label for="theemail">Email</label>
        <input type="radio" id="thephone" name="contact" value="phone">
        <label for="thephone">Phone</label>
        <input type="radio" id="thetext" name="contact" value="text">
        <label for="thetext">Text</label>
        </fieldset>

        <input type="checkbox" id="food" name="cantaloupe" value="like">
        <label for="food">Do you like cantaloupe?</label>

        <label for="msg">Message</label>
        <textarea id="msg" name="msg" rows="7" cols="40"></textarea>

        <button type="submit">Send message</button>
    </form>
    </main>

    <footer></footer>
</body>
</html>
